name: Build kookoo.exe

on:
  push:
    paths:
      - "kookoo.py"
      - ".github/workflows/build-kookoo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name kookoo kookoo.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: kookoo-windows-exe
          path: dist/kookoo.exe
          if-no-files-found: error
