name: Build kookoo.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download game source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Xavier1021-ako/Randomthing/main/kookoo.py" -OutFile "kookoo.py"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name kookoo kookoo.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: kookoo-windows-exe
          path: dist/kookoo.exe
          if-no-files-found: error
